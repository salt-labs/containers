inputs:

  devenv:
    url: github:cachix/devenv/main
    flake: true

  fenix:
    url: github:nix-community/fenix/main
    flake: true

  nix2container:
    url: github:nlewo/nix2container
    flake: true

  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
    flake: true

  git-hooks:
    url: github:cachix/git-hooks.nix/master
    flake: true

  loopy:
    url: github:salt-labs/loopy/trunk
    flake: true

  poetry2nix:
    url: github:nix-community/poetry2nix/master
    flake: false

allowUnfree: false

imports:
  - ./devenv/containers/test

clean:
  enabled: false
  keep:
    - EDITOR

impure: false
